[package]
name = "order_book"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = {version="0.4",features=["serde"]}
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "1.0"
axum = { version = "0.8.9",features=["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "my_benchmark"
harness = false